base_url = "https://thenewmanator15.github.io"
title = "Mathew Newman"
default_language = "en-GB"
compile_sass = false
build_search_index = false
generate_feeds = false
ignored_content = ["_template/*"]

[markdown]
smart_punctuation = false

[link_checker]
# LinkedIn refuses automated requests, so its links are not checked. HAL refuses GitHub's runners
# (the link opened fine by hand on 1 Nov 2026), so it is skipped too. MDPI (10.3390), Frontiers (10.3389)
# and RSC (10.1039) refuse GitHub's runners and plain requests too; each DOI opened in a browser on 12 Nov 2026.
skip_prefixes = ["https://www.linkedin.com/", "https://hal.science/", "https://doi.org/10.3390/",
                 "https://doi.org/10.3389/", "https://doi.org/10.1039/"]

[extra]
# The one Content Security Policy every page carries; tools/check_site.py checks it matches.
csp = "default-src 'self'; img-src 'self' data: https://www.phovir.com; style-src 'self'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
