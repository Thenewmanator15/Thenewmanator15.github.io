# Checks every change, then publishes the site to GitHub Pages from main.
# Pull requests run the checks only. A monthly run keeps the scope's "now" current.
#
# Three jobs: `checks` builds the site, runs every check and uploads the site; `accessibility` runs
# pa11y-ci (fetched from npm) on its own copy, so nothing it runs can touch the uploaded site;
# `deploy` publishes only when both pass. Only `deploy` can write anything.
name: Checks and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.23.6"
  # SHA-256 of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz, from the release's own asset digest.
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zola (checksum verified)
        run: |
          set -euo pipefail
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/zola.tar.gz" "$url"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python tools (hash-pinned)
        run: "python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.txt"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The Python tests read the built site, so the site is built first.
      - name: Unit tests (Python)
        run: |
          zola build
          python -m unittest discover -s tools/tests

      - name: Unit tests (JavaScript)
        run: node --test "tests/js/*.test.mjs"

      - name: Copy rules
        run: python tools/check_copy.py content data templates static/js

      - name: Contrast
        run: python tools/check_contrast.py static/css/tokens.css

      - name: Zola check
        run: zola check

      - name: Build
        run: zola build

      - name: Built-site checks
        run: python tools/check_site.py public/ content/

      # Proof links, archive copies and footer links live in front matter and data files, which
      # zola check doesn't see. The monthly run catches links that go dead later.
      - name: Proof and footer links
        run: python tools/check_links.py content data

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  accessibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zola (checksum verified)
        run: |
          set -euo pipefail
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/zola.tar.gz" "$url"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/zola.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # pa11y tests a built copy (the same files that get deployed, built for this address),
      # not zola serve, which adds a live-reload script.
      - name: Accessibility (pa11y-ci, WCAG 2 AA, 1280 and 375 px)
        run: |
          set -euo pipefail
          zola build --base-url http://127.0.0.1:1111 --output-dir "$RUNNER_TEMP/a11y-site"
          python3 tools/serve_static.py "$RUNNER_TEMP/a11y-site" 1111 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:1111/ > /dev/null && break; sleep 1; done
          npx --yes pa11y-ci@3.1.0 --config .pa11yci.json

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, accessibility]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
