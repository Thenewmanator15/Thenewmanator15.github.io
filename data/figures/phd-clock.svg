<svg class="chart" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540">
<!-- Drawn by hand, not by tools/make_charts.py: the clock chain from the reference board to the converters.
     Solid thick = hardware I designed, thin = on the bought converter card. Theme classes from pages.css. -->
<defs>
<marker id="phd-clock-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="f-fg"/>
</marker>
</defs>
<g font-size="15">

<rect x="10" y="100" width="500" height="372" rx="8" fill="none" class="s-dim" stroke-width="1"/>
<text x="500" y="462" text-anchor="end" font-size="12.5" class="f-dim">on the converter card</text>

<rect x="20" y="20" width="480" height="52" rx="6" fill="none" class="s-c5" stroke-width="2.4"/>
<text x="32" y="42" class="f-fg">Clock reference</text>
<text x="32" y="61" font-size="12.5" class="f-dim">100 MHz OCXO, 2 parts in 10¹¹ over 1 s; measured to the scope's 2.4 ps floor</text>

<rect x="20" y="116" width="480" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="32" y="138" class="f-fg">First loop</text>
<text x="32" y="157" font-size="12.5" class="f-dim">follows the reference below about 100 Hz: long-term stability</text>

<rect x="20" y="202" width="480" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="32" y="224" class="f-fg">Second loop</text>
<text x="32" y="243" font-size="12.5" class="f-dim">3 GHz VCO on a 500 MHz VCSO: sets the jitter, about 200 fs (modelled)</text>

<rect x="20" y="288" width="480" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="32" y="310" class="f-fg">Divide by 3</text>
<text x="32" y="329" font-size="12.5" class="f-dim">one 1 GHz sample clock</text>

<rect x="20" y="384" width="220" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="32" y="406" class="f-fg">DAC</text>
<text x="32" y="425" font-size="12.5" class="f-dim">plays the code</text>

<rect x="280" y="384" width="220" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="292" y="406" class="f-fg">ADC</text>
<text x="292" y="425" font-size="12.5" class="f-dim">records; 120 fs aperture jitter</text>

<g class="s-fg" stroke-width="1.3" fill="none" marker-end="url(#phd-clock-arrow)">
<line x1="260" y1="72" x2="260" y2="114"/>
<line x1="260" y1="168" x2="260" y2="200"/>
<line x1="260" y1="254" x2="260" y2="286"/>
<line x1="200" y1="340" x2="130" y2="382"/>
<line x1="320" y1="340" x2="390" y2="382"/>
</g>
<text x="268" y="96" font-size="12.5" class="f-dim">100 MHz</text>
<text x="268" y="276" font-size="12.5" class="f-dim">3 GHz</text>

<line x1="20" y1="500" x2="56" y2="500" class="s-c5" stroke-width="2.4"/>
<text x="64" y="505" font-size="12.5" class="f-fg">hardware I designed</text>
<line x1="20" y1="526" x2="56" y2="526" class="s-dim" stroke-width="1"/>
<text x="64" y="531" font-size="12.5" class="f-fg">bought, on the converter card</text>
</g>
</svg>
