<svg class="chart" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700">
<!-- Drawn by hand, not by tools/make_charts.py: the PhD system, drive path on the left, capture path on the right.
     Solid thick = hardware I designed, dashed = firmware or software I wrote, thin = bought or the instrument's.
     Colours are theme classes (pages.css), so it follows the scope, paper and high-contrast themes. -->
<defs>
<marker id="phd-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="f-fg"/>
</marker>
</defs>
<g font-size="15">

<!-- outer groups: the converter card and the vacuum -->
<rect x="10" y="190" width="500" height="106" rx="8" fill="none" class="s-dim" stroke-width="1"/>
<text x="260" y="226" text-anchor="middle" font-size="11.5" class="f-dim">converter card</text>
<text x="260" y="243" text-anchor="middle" font-size="11.5" class="f-dim">in the PC, one</text>
<text x="260" y="260" text-anchor="middle" font-size="11.5" class="f-dim">1 GHz clock</text>
<rect x="10" y="420" width="500" height="172" rx="8" fill="none" class="s-dim" stroke-width="1"/>
<text x="500" y="582" text-anchor="end" font-size="12.5" class="f-dim">In vacuum: the BioTOF</text>

<!-- drive path, left -->
<rect x="20" y="20" width="190" height="52" rx="6" fill="none" class="s-c5" stroke-width="2.4"/>
<text x="32" y="42" class="f-fg">Clock reference</text>
<text x="32" y="61" font-size="12.5" class="f-dim">100 MHz OCXO</text>

<rect x="20" y="206" width="190" height="52" rx="6" fill="none" class="s-c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="32" y="228" class="f-fg">Pattern generator</text>
<text x="32" y="247" font-size="12.5" class="f-dim">m-sequence, 1 GS/s DAC</text>

<rect x="20" y="330" width="190" height="52" rx="6" fill="none" class="s-c5" stroke-width="2.4"/>
<text x="32" y="352" class="f-fg">Driver</text>
<text x="32" y="371" font-size="12.5" class="f-dim">GaN, 150 V, 1.3–1.8 ns</text>

<rect x="20" y="440" width="190" height="52" rx="6" fill="none" class="s-c5" stroke-width="2.4"/>
<text x="32" y="462" class="f-fg">Gate</text>
<text x="32" y="481" font-size="12.5" class="f-dim">Bradbury–Nielsen wires</text>

<!-- capture path, right -->
<rect x="310" y="20" width="190" height="52" rx="6" fill="none" class="s-c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="322" y="42" class="f-fg">Decode</text>
<text x="322" y="61" font-size="12.5" class="f-dim">Julia, back to a spectrum</text>

<rect x="310" y="110" width="190" height="52" rx="6" fill="none" class="s-c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="322" y="132" class="f-fg">Recording</text>
<text x="322" y="151" font-size="12.5" class="f-dim">LabVIEW, 4 s bursts</text>

<rect x="310" y="206" width="190" height="52" rx="6" fill="none" class="s-c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="322" y="228" class="f-fg">Capture</text>
<text x="322" y="247" font-size="12.5" class="f-dim">16-bit, 1 GS/s ADC</text>

<rect x="310" y="330" width="190" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="322" y="352" class="f-fg">Pre-amplifier</text>
<text x="322" y="371" font-size="12.5" class="f-dim">bought, 28 dB</text>

<rect x="310" y="440" width="190" height="52" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="322" y="462" class="f-fg">Detector</text>
<text x="322" y="481" font-size="12.5" class="f-dim">single ions, about 2 ns</text>

<rect x="220" y="512" width="80" height="40" rx="6" fill="none" class="s-dim" stroke-width="1"/>
<text x="260" y="537" text-anchor="middle" class="f-fg">Sample</text>

<!-- arrows -->
<g class="s-fg" stroke-width="1.3" fill="none" marker-end="url(#phd-architecture-arrow)">
<line x1="115" y1="72" x2="115" y2="188"/>
<line x1="115" y1="258" x2="115" y2="328"/>
<line x1="115" y1="382" x2="115" y2="438"/>
<line x1="115" y1="560" x2="115" y2="494"/>
<line x1="180" y1="492" x2="226" y2="514"/>
<line x1="294" y1="514" x2="340" y2="494"/>
<line x1="405" y1="440" x2="405" y2="384"/>
<line x1="405" y1="330" x2="405" y2="260"/>
<line x1="405" y1="206" x2="405" y2="164"/>
<line x1="405" y1="110" x2="405" y2="74"/>
</g>
<text x="123" y="135" font-size="12.5" class="f-dim">100 MHz</text>
<text x="123" y="318" font-size="12.5" class="f-dim">the code</text>
<text x="123" y="414" font-size="12.5" class="f-dim">±75 V</text>
<text x="24" y="578" font-size="12.5" class="f-dim">C60 ion beam</text>
<text x="413" y="414" font-size="12.5" class="f-dim">mV pulses</text>
<text x="413" y="187" font-size="12.5" class="f-dim">samples</text>
<text x="413" y="96" font-size="12.5" class="f-dim">files</text>

<!-- legend -->
<line x1="20" y1="625" x2="56" y2="625" class="s-c5" stroke-width="2.4"/>
<text x="64" y="630" font-size="12.5" class="f-fg">hardware I designed</text>
<line x1="20" y1="652" x2="56" y2="652" class="s-c2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="64" y="657" font-size="12.5" class="f-fg">firmware or software I wrote or changed</text>
<line x1="20" y1="679" x2="56" y2="679" class="s-dim" stroke-width="1"/>
<text x="64" y="684" font-size="12.5" class="f-fg">bought, or part of the instrument</text>
</g>
</svg>
