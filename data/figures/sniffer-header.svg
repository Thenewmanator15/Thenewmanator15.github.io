<svg class="chart" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 132">
<!-- Drawn by hand from esp32c6-sniffer shared/frame.h: a 10-byte little-endian header shared by both boards. -->
<g font-size="11" text-anchor="middle" class="f-dim">
<text x="10" y="16">0</text><text x="60" y="16">1</text><text x="110" y="16">2</text><text x="160" y="16">3</text>
<text x="210" y="16">4</text><text x="260" y="16">5</text><text x="310" y="16">6</text><text x="360" y="16">7</text>
<text x="410" y="16">8</text><text x="460" y="16">9</text><text x="510" y="16">10</text>
</g>
<rect x="12" y="24" width="96" height="60" rx="5" fill="none" class="s-trace" stroke-width="1.4"/>
<rect x="112" y="24" width="46" height="60" rx="5" fill="none" class="s-c2" stroke-width="1.4"/>
<rect x="162" y="24" width="46" height="60" rx="5" fill="none" class="s-trace" stroke-width="1.4"/>
<rect x="212" y="24" width="96" height="60" rx="5" fill="none" class="s-c2" stroke-width="1.4"/>
<rect x="312" y="24" width="96" height="60" rx="5" fill="none" class="s-trace" stroke-width="1.4"/>
<rect x="412" y="24" width="96" height="60" rx="5" fill="none" class="s-c2" stroke-width="1.4"/>
<g font-size="13" text-anchor="middle" class="f-fg">
<text x="60" y="50">magic</text><text x="135" y="50">type</text><text x="185" y="50">flags</text>
<text x="260" y="50">seq</text><text x="360" y="50">length</text><text x="460" y="50">CRC-16</text>
</g>
<g font-size="11" text-anchor="middle" class="f-dim">
<text x="60" y="70">0x5AC6</text><text x="360" y="70">up to 4096</text><text x="460" y="70">bytes 0 to 7</text>
</g>
<text x="12" y="106" font-size="11" class="f-dim">byte offset along the top, little-endian</text>
<text x="12" y="124" font-size="11" class="f-dim">then up to 4096 bytes of payload</text>
</svg>
