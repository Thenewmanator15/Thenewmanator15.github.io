<svg class="chart" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410">
<!-- Drawn by hand from the esp32c6-sniffer firmware: queue depths from radio154.c, radio80211.c and radio_ble.c
     (RX_QUEUE_LEN), ring from usb_link.c (RING_BYTES 64 KB, SN_TX_CHUNK 4096). Colours are theme classes. -->
<defs>
<marker id="sniffer-datapath-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" class="f-trace"/>
</marker>
</defs>
<text x="8" y="16" font-size="11" class="f-dim">ON THE BOARD</text>
<rect x="2" y="24" width="516" height="222" rx="10" fill="none" class="s-dim" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="14" y="40" width="100" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="64" y="68" font-size="13" text-anchor="middle" class="f-fg">802.15.4</text>
<rect x="14" y="112" width="100" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="64" y="140" font-size="13" text-anchor="middle" class="f-fg">Wi-Fi</text>
<rect x="14" y="184" width="100" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="64" y="212" font-size="13" text-anchor="middle" class="f-fg">Bluetooth LE</text>
<rect x="136" y="40" width="112" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="192" y="59" font-size="13" text-anchor="middle" class="f-fg">queue, task</text>
<text x="192" y="77" font-size="11" text-anchor="middle" class="f-dim">32 deep</text>
<rect x="136" y="112" width="112" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="192" y="131" font-size="13" text-anchor="middle" class="f-fg">queue, task</text>
<text x="192" y="149" font-size="11" text-anchor="middle" class="f-dim">24 deep</text>
<rect x="136" y="184" width="112" height="46" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="192" y="203" font-size="13" text-anchor="middle" class="f-fg">queue, task</text>
<text x="192" y="221" font-size="11" text-anchor="middle" class="f-dim">24 deep</text>
<path d="M114 63 H136 M114 135 H136 M114 207 H136 M248 63 H262 V207 H248" fill="none" class="s-trace" stroke-width="1.6"/>
<path d="M248 135 H278" fill="none" class="s-trace" stroke-width="1.6" marker-end="url(#sniffer-datapath-arrow)"/>
<rect x="278" y="106" width="104" height="58" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="330" y="130" font-size="13" text-anchor="middle" class="f-fg">ring buffer</text>
<text x="330" y="150" font-size="11" text-anchor="middle" class="f-dim">64 KB</text>
<path d="M382 135 H400" fill="none" class="s-trace" stroke-width="1.6" marker-end="url(#sniffer-datapath-arrow)"/>
<rect x="400" y="106" width="108" height="58" rx="6" fill="none" class="s-trace" stroke-width="1.4"/>
<text x="454" y="130" font-size="13" text-anchor="middle" class="f-fg">send task</text>
<text x="454" y="150" font-size="11" text-anchor="middle" class="f-dim">4 KB chunks</text>
<path d="M436 164 V300" fill="none" class="s-trace" stroke-width="1.6" marker-end="url(#sniffer-datapath-arrow)"/>
<text x="428" y="232" font-size="12" text-anchor="end" class="f-fg">USB</text>
<path d="M484 300 V164" fill="none" class="s-c2" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#sniffer-datapath-arrow)"/>
<text x="476" y="232" font-size="11" text-anchor="middle" class="f-dim" transform="rotate(-90 476 232)">commands</text>
<text x="8" y="266" font-size="11" class="f-dim">ON THE LAPTOP</text>
<rect x="2" y="274" width="516" height="132" rx="10" fill="none" class="s-dim" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="400" y="300" width="108" height="58" rx="6" fill="none" class="s-c2" stroke-width="1.4"/>
<text x="454" y="324" font-size="13" text-anchor="middle" class="f-fg">plugin</text>
<text x="454" y="344" font-size="11" text-anchor="middle" class="f-dim">Python extcap</text>
<path d="M400 329 H346" fill="none" class="s-trace" stroke-width="1.6" marker-end="url(#sniffer-datapath-arrow)"/>
<rect x="186" y="292" width="160" height="96" rx="6" fill="none" class="s-c2" stroke-width="1.4"/>
<text x="266" y="314" font-size="13" text-anchor="middle" class="f-fg">Wireshark</text>
<text x="266" y="334" font-size="11" text-anchor="middle" class="f-dim">802.15.4</text>
<text x="266" y="352" font-size="11" text-anchor="middle" class="f-dim">Wi-Fi</text>
<text x="266" y="370" font-size="11" text-anchor="middle" class="f-dim">Bluetooth LE</text>
<text x="14" y="322" font-size="11" class="f-dim">toolbar in Wireshark:</text>
<text x="14" y="340" font-size="11" class="f-dim">channel, antenna,</text>
<text x="14" y="358" font-size="11" class="f-dim">log window</text>
</svg>
